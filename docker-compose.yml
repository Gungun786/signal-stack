version: '3.8'

services:
  signal-stack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signal-stack-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENV=production
      - DATABASE_URL=sqlite:///./signal_stack.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CRON_SECRET=${CRON_SECRET:-signal_stack_secure_cron_token_2026}
    volumes:
      - signal_data:/app/backend
    restart: unless-stopped

volumes:
  signal_data:
