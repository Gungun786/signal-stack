name: Monday Morning Weekly Brief Cron

on:
  schedule:
    # Every Monday at 06:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-weekly-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Weekly Intelligence Brief Engine
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://signal-stack-backend.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'signal_stack_secure_cron_token_2026' }}
        run: |
          echo "Waking up Signal Stack backend & initiating Weekly Brief cycle..."
          
          # Wakeup / health ping
          curl -s -f "$BACKEND_URL/health" || true
          
          # Trigger pipeline endpoint
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "$BACKEND_URL/api/scheduler/trigger-weekly" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          
          echo "Engine Response Status: $HTTP_STATUS"
          echo "Engine Payload: $BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Weekly Brief pipeline failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
          echo "Weekly brief successfully compiled and stored in Signal Stack database."
