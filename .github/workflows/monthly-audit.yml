name: Monthly Signal Stack Audit Cron

on:
  schedule:
    # 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-monthly-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Monthly Signal Stack Audit Engine
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://signal-stack-backend.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'signal_stack_secure_cron_token_2026' }}
        run: |
          echo "Initiating Monthly Source Health Audit..."
          
          curl -s -f "$BACKEND_URL/health" || true
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "$BACKEND_URL/api/scheduler/trigger-monthly" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          
          echo "Audit Response Status: $HTTP_STATUS"
          echo "Audit Payload: $BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Monthly Audit pipeline failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
          echo "Monthly Audit report generated and logged to dashboard."
